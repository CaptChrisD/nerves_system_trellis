# ESP32-C6 WiFi module via esp-hosted SDIO driver
# resetpin = PG11 = (6 * 32) + 11 = 203 (DTS label: ESP_RESET)
#
# resetpin is DISABLED because cold-boot recovery is handled by the
# userspace EspWifi GenServer in the firmware app, which performs:
#   1) pulse EN via Circuits.GPIO("ESP_RESET")
#   2) unbind/bind the sunxi-mmc platform driver (forces a full SDIO
#      re-enumeration including a fresh RCA, which mmc_hw_reset alone
#      cannot do from this kernel module's __init context)
#   3) modprobe esp32_sdio (the driver's esp_reset() is then a no-op
#      and does NOT re-pulse EN, which would race the userspace pulse)
#
# Enable resetpin only if you remove the userspace bring-up sequence.
# options esp32_sdio resetpin=203
